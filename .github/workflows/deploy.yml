name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  secure-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/kitsunezu-portfolio
      LOCAL_IMAGE: kitsunezu-portfolio:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

      # Production dependency policy: High and Critical findings block deployment.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build candidate image
        run: docker build --tag "$LOCAL_IMAGE" .

      # Image policy: all fixed and unfixed High/Critical findings block deployment.
      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified image
        run: |
          short_sha="${GITHUB_SHA::7}"
          docker tag "$LOCAL_IMAGE" "$IMAGE_NAME:latest"
          docker tag "$LOCAL_IMAGE" "$IMAGE_NAME:$short_sha"
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$short_sha"

      - name: Trigger Portainer redeploy
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_BASE_URL: https://portainer.kitsunet.app
          PORTAINER_STACK_ID: "34"
          PORTAINER_ENDPOINT_ID: "3"
        run: |
          if [ -z "$PORTAINER_API_KEY" ]; then
            echo "::error::PORTAINER_API_KEY secret is not configured"
            exit 1
          fi
          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::error::Cloudflare Access service token secrets are not configured"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "CF-Access-Client-ID: $CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --header "X-API-Key: $PORTAINER_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"RepullImageAndRedeploy":true}' \
            "$PORTAINER_BASE_URL/api/stacks/$PORTAINER_STACK_ID/git/redeploy?endpointId=$PORTAINER_ENDPOINT_ID"
